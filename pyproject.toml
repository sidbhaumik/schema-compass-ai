[project]
name = "schema-compass"
version = "1.0.0"
description = "Semantic source-to-target matching for data migrations across Snowflake and Databricks"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2", "fastapi>=0.110,<1", "uvicorn>=0.29,<1",
                "python-multipart>=0.0.9", "anthropic>=2.11,<3", "openpyxl>=3.1", "databricks-sdk>=0.30"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
connectors = ["snowflake-connector-python>=3,<5", "databricks-sdk>=0.30"]
dev = ["httpx>=0.27"]

[project.scripts]
schema-compass = "schema_compass.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["schema_compass"]

[tool.setuptools.package-data]
schema_compass = ["static/*"]
