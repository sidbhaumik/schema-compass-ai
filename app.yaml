# Databricks Apps entry point.
# Deploy: databricks apps deploy <app-name> --source-code-path /Workspace/Users/<you>/schema-compass
# Databricks signs users in and forwards their identity; Schema Compass records it on each decision.
# App storage is temporary: point --home at persistent storage if projects must survive redeploys.
command: ["python", "-m", "schema_compass.cli", "serve", "--host", "0.0.0.0", "--home", "/tmp/schema-compass"]

# Optional AI review: add a secret resource to the app (key "anthropic-api-key"), then uncomment:
# env:
#   - name: ANTHROPIC_API_KEY
#     valueFrom: anthropic-api-key
